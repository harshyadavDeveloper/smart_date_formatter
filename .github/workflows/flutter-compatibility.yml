name: Flutter Compatibility

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  compatibility:
    name: Test on Flutter ${{ matrix.channel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - beta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test