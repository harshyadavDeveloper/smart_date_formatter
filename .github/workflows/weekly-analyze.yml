name: Weekly Analyze

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze